<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내전 선수 경매 (연습판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d14;
    --panel: #141824;
    --panel-2: #1b2030;
    --line: #2a3145;
    --text: #eef1f8;
    --muted: #8a93ab;
    --accent: #ff4655;
    --gold: #ffd166;
    --ok: #3ddc97;
    --warn: #ffb020;
    --num: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,70,85,.18), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(80,120,255,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .28; filter: grayscale(.8); }
  input { font: inherit; }

  /* ---------- 상단 바 ---------- */
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: rgba(10,12,20,.7); backdrop-filter: blur(6px);
  }
  .logo { font-family: var(--num); font-size: 26px; letter-spacing: 1px; }
  .logo span { color: var(--accent); }
  .badge { font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .spacer { flex: 1; }
  .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; font-weight: 700;
  }
  .btn:hover:not(:disabled) { border-color: #4a5577; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1400; }
  .chk { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  /* ---------- 가운데 영역 ---------- */
  .main {
    display: grid; grid-template-columns: 240px 1fr 280px; gap: 16px;
    padding: 16px 20px;
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 2px; color: var(--muted); font-weight: 700; }

  .queue { max-height: 440px; overflow: auto; }
  .queue ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .queue li {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    padding: 6px 8px; background: var(--panel-2); border-radius: 8px; font-size: 13px;
  }
  .queue li .n { color: var(--muted); width: 20px; }
  .queue li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag-unsold { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }

  /* 무대 */
  .stage {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    background: linear-gradient(160deg, #1a1f30, #10131d);
    border: 1px solid var(--line); border-radius: 18px; padding: 22px; position: relative; overflow: hidden;
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 12px);
  }
  .card-label { font-size: 12px; letter-spacing: 3px; color: var(--accent); font-weight: 900; }
  .p-name { font-family: var(--num); font-size: clamp(40px, 5vw, 72px); line-height: 1.05; margin: 6px 0 12px; word-break: break-all; }
  .p-pos { display: inline-block; padding: 4px 12px; border-radius: 999px; background: rgba(255,70,85,.15); color: #ff8c96; font-weight: 700; font-size: 14px; }
  .p-tiers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .p-tiers div { background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px; }
  .p-tiers small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .p-tiers b { font-size: 17px; }
  .p-tiers .score b { font-family: var(--num); font-size: 26px; color: var(--gold); font-weight: 400; }
  .p-unsold { margin-top: 12px; font-size: 13px; color: var(--warn); min-height: 18px; }

  .bidbox { display: flex; flex-direction: column; gap: 14px; }
  .bid-now small, .timer small { font-size: 12px; letter-spacing: 3px; color: var(--muted); font-weight: 700; }
  .bid-amount { font-family: var(--num); font-size: clamp(64px, 8vw, 120px); line-height: 1; color: var(--gold); text-shadow: 0 0 30px rgba(255,209,102,.35); }
  .bid-amount.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .bid-leader { font-size: 18px; font-weight: 900; min-height: 26px; }
  .timer-num { font-family: var(--num); font-size: clamp(44px, 5vw, 72px); line-height: 1; }
  .timer-num.low { color: var(--accent); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .timer-plus { font-family: var(--num); color: var(--ok); font-size: 28px; margin-left: 10px; opacity: 0; }
  .timer-plus.show { animation: plus 1s ease forwards; }
  @keyframes plus { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-24px); } }
  .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .state-line { font-size: 13px; color: var(--muted); }

  /* 기록 */
  .log { max-height: 440px; overflow: auto; }
  .log ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .log li { padding: 6px 8px; background: var(--panel-2); border-radius: 8px; border-left: 3px solid var(--line); }
  .log li.sold { border-left-color: var(--gold); }
  .log li.unsold { border-left-color: var(--warn); }
  .log li.bid { border-left-color: var(--ok); }

  /* ---------- 팀 영역 ---------- */
  .teams { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 0 20px 24px; }
  .team {
    background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--c);
    border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    transition: box-shadow .2s, transform .2s;
  }
  .team.leading { box-shadow: 0 0 0 2px var(--c), 0 0 28px color-mix(in srgb, var(--c) 55%, transparent); transform: translateY(-3px); }
  .team.pulse { animation: tpulse .45s ease; }
  @keyframes tpulse { 0% { background: color-mix(in srgb, var(--c) 35%, var(--panel)); } 100% { background: var(--panel); } }
  .team-head { display: flex; justify-content: space-between; align-items: baseline; }
  .team-name { font-family: var(--num); font-size: 24px; color: var(--c); }
  .team-slots { font-size: 13px; color: var(--muted); }
  .team-slots b { color: var(--text); font-size: 16px; }
  .team-points { font-family: var(--num); font-size: 40px; line-height: 1; }
  .team-points small { font-family: "Noto Sans KR"; font-size: 12px; color: var(--muted); margin-left: 4px; }
  .team-points.changed { animation: pchg .8s ease; }
  @keyframes pchg { 0% { color: var(--accent); transform: scale(1.12); } 100% { color: var(--text); transform: scale(1); } }
  .team-score { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .team-score div { background: rgba(255,255,255,.04); border-radius: 8px; padding: 6px 8px; }
  .team-score small { display: block; font-size: 11px; color: var(--muted); }
  .team-score b { font-family: var(--num); font-size: 20px; font-weight: 400; color: var(--gold); }
  .roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; min-height: 150px; }
  .roster li { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); }
  .roster li.empty { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .roster li .pr { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .roster li .rnd { color: var(--warn); }
  .bids { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bids .q { background: var(--c); color: #0b0d14; border: 0; border-radius: 8px; padding: 10px 0; font-weight: 900; font-size: 16px; }
  .bids .direct { grid-column: 1 / -1; display: flex; gap: 6px; }
  .bids .direct input { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px; }
  .bids .direct button { background: var(--panel-2); color: var(--c); border: 1px solid var(--c); border-radius: 8px; padding: 0 12px; font-weight: 900; }
  .why { font-size: 12px; color: var(--muted); min-height: 16px; }

  /* ---------- 낙찰 번쩍 ---------- */
  .flash {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 50; pointer-events: none;
    background: radial-gradient(circle at center, color-mix(in srgb, var(--c) 60%, transparent), rgba(0,0,0,.85) 70%);
  }
  .flash.show { display: grid; animation: flashbg 2.2s ease forwards; }
  @keyframes flashbg {
    0% { opacity: 0; } 6% { opacity: 1; background-color: rgba(255,255,255,.9); }
    14% { background-color: transparent; } 85% { opacity: 1; } 100% { opacity: 0; }
  }
  .flash-inner { text-align: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  .flash-title { font-family: var(--num); font-size: clamp(80px, 14vw, 200px); line-height: 1; color: #fff; text-shadow: 0 0 40px var(--c), 0 0 90px var(--c); }
  .flash-sub { font-family: var(--num); font-size: clamp(28px, 4vw, 54px); margin-top: 10px; }
  .flash-sub em { font-style: normal; color: var(--c); }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2b1115; border: 1px solid var(--accent); color: #ffd2d6; padding: 10px 16px; border-radius: 10px; display: none; z-index: 60; }

  @media (max-width: 1200px) {
    .main { grid-template-columns: 1fr; }
    .queue, .log { max-height: 220px; }
    .teams { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }
  @media (max-width: 700px) {
    header, .main, .teams { padding-left: 16px; padding-right: 16px; }
    .stage { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">VALORANT <span>내전 경매</span></div>
  <span class="badge">연습판 · 이 화면에서만 동작</span>
  <div class="spacer"></div>
  <div class="ctrl">
    <span class="state-line" id="progress"></span>
    <button class="btn primary" id="btnStart">경매 시작 (Space)</button>
    <button class="btn" id="btnPause">일시정지</button>
    <button class="btn gold" id="btnHammer">지금 마감</button>
    <label class="chk"><input type="checkbox" id="autoNext"> 다음 선수 자동 시작</label>
    <button class="btn" id="btnReset">처음부터 다시</button>
  </div>
</header>

<div class="main">
  <section class="panel queue">
    <h3>대기 순서</h3>
    <ol id="queue"></ol>
  </section>

  <section class="stage">
    <div>
      <div class="card-label">NOW ON AUCTION</div>
      <div class="p-name" id="pName">-</div>
      <span class="p-pos" id="pPos">-</span>
      <div class="p-tiers">
        <div><small>최고 티어</small><b id="pPeak">-</b></div>
        <div><small>현재 티어</small><b id="pCur">-</b></div>
        <div class="score"><small>티어 점수</small><b id="pScore">-</b></div>
      </div>
      <div class="p-unsold" id="pUnsold"></div>
    </div>
    <div class="bidbox">
      <div class="bid-now">
        <small>현재 최고가</small>
        <div class="bid-amount" id="bidAmount">0</div>
        <div class="bid-leader" id="bidLeader">아직 입찰 없음</div>
      </div>
      <div class="timer">
        <small>남은 시간</small>
        <div><span class="timer-num" id="timerNum">-</span><span class="timer-plus" id="timerPlus">+5</span></div>
        <div class="bar"><i id="timerBar"></i></div>
      </div>
      <div class="state-line" id="stateLine"></div>
    </div>
  </section>

  <section class="panel log">
    <h3>진행 기록</h3>
    <ul id="log"></ul>
  </section>
</div>

<section class="teams" id="teams"></section>

<div class="flash" id="flash"><div class="flash-inner"><div class="flash-title" id="flashTitle">SOLD</div><div class="flash-sub" id="flashSub"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   [1] 바꾸기 쉬운 숫자 모음 — 규칙을 바꾸고 싶으면 여기만 고치세요
   ===================================================================== */
const CONFIG = {
  startPoints: 1000,     // 팀 시작 포인트
  bidStep: 5,            // 최소 입찰 단위 (직접 입력도 이 단위로만 가능)
  quickBids: [5, 10],    // 팀별 빠른 입찰 버튼 (+5, +10)
  teamSize: 5,           // 한 팀 최대 인원
  startSeconds: 15,      // 선수 한 명당 처음 주어지는 시간(초)
  bidAddSeconds: 5,      // 입찰할 때마다 늘어나는 시간(초)
  maxSeconds: 30,        // 남은 시간 최대치(초)
  maxUnsold: 2,          // 이 횟수만큼 유찰되면 빈자리 팀에 무작위 배정
  resultShowMs: 2200,    // 낙찰/유찰 화면을 보여 주는 시간(밀리초)
};

/* =====================================================================
   [2] 티어 점수표와 계산 방식 — 점수를 바꾸고 싶으면 여기만 고치세요
   아이언1 = 1점, 한 칸 오를 때마다 +1점, 레디언트 = 25점
   ===================================================================== */
const TIER_GROUPS = [
  ["아이언", 3], ["브론즈", 3], ["실버", 3], ["골드", 3], ["플래티넘", 3],
  ["다이아몬드", 3], ["초월자", 3], ["불멸", 3], ["레디언트", 1],
];
const TIER_SCORE = {};
(() => {
  let s = 1;
  for (const [name, steps] of TIER_GROUPS) {
    if (steps === 1) TIER_SCORE[name] = s++;
    else for (let i = 1; i <= steps; i++) TIER_SCORE[`${name} ${i}`] = s++;
  }
})();
// 선수 점수 = (최고 티어 점수 + 현재 티어 점수) ÷ 2, 소수점 첫째 자리까지
function playerScore(p) {
  return round1((TIER_SCORE[p.peak] + TIER_SCORE[p.current]) / 2);
}
// 팀 점수 = 선수 점수 합계, 평균 = 합계 ÷ 선수 수
function teamScore(team) {
  const sum = round1(team.roster.reduce((a, r) => a + playerScore(r.player), 0));
  const avg = team.roster.length ? round1(sum / team.roster.length) : null;
  return { sum, avg };
}
function round1(n) { return Math.round(n * 10) / 10; }

/* =====================================================================
   [3] 가짜 선수 25명과 5팀
   ===================================================================== */
const TEAMS_SEED = [
  { name: "1팀", color: "#ff4655" },
  { name: "2팀", color: "#4da3ff" },
  { name: "3팀", color: "#3ddc97" },
  { name: "4팀", color: "#ffc93c" },
  { name: "5팀", color: "#b67cff" },
];
// 포지션: 타격대 / 척후대 / 감시자 / 전략가
const PLAYERS_SEED = [
  ["새벽고양이", "불멸 2", "초월자 3", "타격대"],
  ["한강라면", "다이아몬드 1", "플래티넘 3", "전략가"],
  ["멍때리는부엉이", "골드 3", "골드 1", "감시자"],
  ["조준점요정", "초월자 1", "다이아몬드 2", "타격대"],
  ["연막장인", "플래티넘 2", "플래티넘 1", "전략가"],
  ["섬광은사랑", "실버 3", "실버 2", "척후대"],
  ["헤드만노림", "레디언트", "불멸 3", "타격대"],
  ["수비의신", "다이아몬드 3", "다이아몬드 1", "감시자"],
  ["드론조종사", "골드 2", "실버 3", "척후대"],
  ["고구마맛탕", "브론즈 3", "브론즈 2", "감시자"],
  ["칼침전문가", "불멸 1", "초월자 2", "타격대"],
  ["밤하늘연막", "초월자 2", "초월자 1", "전략가"],
  ["달리는토끼", "실버 1", "브론즈 3", "타격대"],
  ["정보수집가", "플래티넘 3", "골드 3", "척후대"],
  ["철벽함정", "골드 1", "골드 1", "감시자"],
  ["초코우유", "아이언 3", "아이언 2", "전략가"],
  ["에임연습중", "다이아몬드 2", "플래티넘 2", "타격대"],
  ["바람의검객", "초월자 3", "초월자 2", "타격대"],
  ["포켓힐러", "플래티넘 1", "골드 2", "감시자"],
  ["스캔한번만", "불멸 3", "불멸 1", "척후대"],
  ["늦잠대장", "브론즈 1", "아이언 3", "척후대"],
  ["벽뒤의그림자", "다이아몬드 1", "다이아몬드 1", "전략가"],
  ["클러치장인", "초월자 1", "플래티넘 3", "감시자"],
  ["노란우산", "실버 2", "실버 1", "전략가"],
  ["마지막한발", "골드 3", "골드 2", "척후대"],
];

/* =====================================================================
   [4] 경매 진행 로직
   ===================================================================== */
let teams, queue, current, bid, state, endAt, pausedLeft, nextTimer;
// state: ready(시작 전) / running(진행 중) / paused(일시정지) / result(결과 표시 중) / done(끝)

function init() {
  clearTimeout(nextTimer);
  teams = TEAMS_SEED.map((t, i) => ({ id: i, ...t, points: CONFIG.startPoints, roster: [] }));
  queue = PLAYERS_SEED.map(([name, peak, cur, pos], i) => ({ id: i, name, peak, current: cur, pos, unsold: 0 }));
  for (const p of queue) {
    if (!(p.peak in TIER_SCORE) || !(p.current in TIER_SCORE)) console.warn("점수표에 없는 티어:", p);
  }
  document.getElementById("log").innerHTML = "";
  buildTeams();
  nextPlayer();
  addLog(`경매 준비 완료 — 선수 ${queue.length + 1}명, ${teams.length}팀, 팀당 ${CONFIG.startPoints}포인트`);
}

function nextPlayer() {
  current = queue.shift() || null;
  bid = { amount: 0, team: null };
  endAt = null; pausedLeft = null;
  state = current ? "ready" : "done";
  if (!current) addLog("모든 선수의 경매가 끝났습니다.", "sold");
  render();
  if (current && document.getElementById("autoNext").checked) startLot();
}

function startLot() {
  if (state === "ready") {
    state = "running";
    endAt = performance.now() + CONFIG.startSeconds * 1000;
    addLog(`${current.name} 경매 시작 (${CONFIG.startSeconds}초)`);
  } else if (state === "paused") {
    state = "running";
    endAt = performance.now() + pausedLeft;
    pausedLeft = null;
  } else return;
  render();
  requestAnimationFrame(tick);
}

function pauseLot() {
  if (state !== "running") return;
  pausedLeft = Math.max(0, endAt - performance.now());
  state = "paused";
  render();
}

function timeLeft() {
  if (state === "running") return Math.max(0, endAt - performance.now());
  if (state === "paused") return pausedLeft;
  if (state === "ready") return CONFIG.startSeconds * 1000;
  return 0;
}

function tick() {
  if (state !== "running") return;
  if (endAt - performance.now() <= 0) { finishLot(); return; }
  renderTimer();
  requestAnimationFrame(tick);
}

// 이 팀이 이 금액으로 입찰할 수 있는가? 안 되면 이유를 돌려줌
function bidBlockReason(team, amount) {
  if (state !== "running") return "경매 진행 중이 아님";
  if (team.roster.length >= CONFIG.teamSize) return "팀 인원이 꽉 참";
  if (bid.team === team.id) return "현재 최고가 팀";
  if (amount > team.points) return "포인트 부족";
  return null;
}

function placeBid(teamId, amount) {
  const team = teams[teamId];
  if (amount < bid.amount + CONFIG.bidStep) return toast(`최소 ${bid.amount + CONFIG.bidStep}포인트 이상 입찰해야 합니다.`);
  if (amount % CONFIG.bidStep !== 0) return toast(`입찰은 ${CONFIG.bidStep}포인트 단위로만 가능합니다.`);
  const why = bidBlockReason(team, amount);
  if (why) return toast(`${team.name}: ${why}`);

  const now = performance.now();
  const before = Math.max(0, endAt - now);
  const after = Math.min(before + CONFIG.bidAddSeconds * 1000, CONFIG.maxSeconds * 1000);
  endAt = now + after;
  bid = { amount, team: team.id };
  addLog(`${team.name} ${amount}P 입찰 · 시간 ${(before / 1000).toFixed(1)}초 → ${(after / 1000).toFixed(1)}초`, "bid");

  render();
  bumpEl(document.getElementById("bidAmount"), "bump");
  const plus = document.getElementById("timerPlus");
  plus.textContent = `+${((after - before) / 1000).toFixed(1)}`;
  bumpEl(plus, "show");
  bumpEl(document.querySelector(`.team[data-id="${team.id}"]`), "pulse");
}

function finishLot() {
  if (state !== "running" && state !== "paused") return;
  state = "result";
  const p = current;
  if (bid.team !== null) {
    const team = teams[bid.team];
    team.points -= bid.amount;
    team.roster.push({ player: p, price: bid.amount });
    addLog(`낙찰! ${p.name} → ${team.name} (${bid.amount}P)`, "sold");
    flash("낙찰!", `<em>${team.name}</em> · ${p.name} · ${bid.amount}P`, team.color);
    render(team.id);
  } else {
    p.unsold++;
    if (p.unsold >= CONFIG.maxUnsold) {
      const open = teams.filter(t => t.roster.length < CONFIG.teamSize);
      const team = open[Math.floor(Math.random() * open.length)];
      team.roster.push({ player: p, price: 0, random: true });
      addLog(`${p.name} ${p.unsold}번째 유찰 → ${team.name}에 무작위 배정 (0P)`, "unsold");
      flash("무작위 배정", `${p.name} → <em>${team.name}</em>`, team.color);
      render(team.id);
    } else {
      queue.push(p);
      addLog(`유찰 — ${p.name} 순서 맨 뒤로 (${p.unsold}번째 유찰)`, "unsold");
      flash("유찰", `${p.name} · 순서 맨 뒤로`, "#8a93ab");
      render();
    }
  }
  nextTimer = setTimeout(nextPlayer, CONFIG.resultShowMs);
}

/* =====================================================================
   [5] 화면 그리기
   ===================================================================== */
function buildTeams() {
  const wrap = document.getElementById("teams");
  wrap.innerHTML = "";
  for (const t of teams) {
    const el = document.createElement("div");
    el.className = "team";
    el.dataset.id = t.id;
    el.style.setProperty("--c", t.color);
    el.innerHTML = `
      <div class="team-head"><div class="team-name">${t.name}</div><div class="team-slots">빈자리 <b data-k="slots"></b></div></div>
      <div class="team-points" data-k="points"></div>
      <div class="team-score">
        <div><small>티어 점수 합계</small><b data-k="sum"></b></div>
        <div><small>티어 점수 평균</small><b data-k="avg"></b></div>
      </div>
      <ul class="roster" data-k="roster"></ul>
      <div class="bids">
        ${CONFIG.quickBids.map(q => `<button class="q" data-q="${q}">+${q}</button>`).join("")}
        <div class="direct"><input type="number" inputmode="numeric" step="${CONFIG.bidStep}" placeholder="직접 입력"><button data-direct>입찰</button></div>
      </div>
      <div class="why" data-k="why"></div>`;
    el.querySelectorAll("[data-q]").forEach(b =>
      b.addEventListener("click", () => placeBid(t.id, bid.amount + Number(b.dataset.q))));
    const input = el.querySelector("input");
    const submit = () => { const v = Number(input.value); if (!v) return; placeBid(t.id, v); input.value = ""; };
    el.querySelector("[data-direct]").addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    wrap.appendChild(el);
  }
}

function render(changedTeamId = null) {
  // 선수 카드
  const p = current;
  document.getElementById("pName").textContent = p ? p.name : "경매 종료";
  document.getElementById("pPos").textContent = p ? p.pos : "-";
  document.getElementById("pPeak").textContent = p ? `${p.peak} (${TIER_SCORE[p.peak]}점)` : "-";
  document.getElementById("pCur").textContent = p ? `${p.current} (${TIER_SCORE[p.current]}점)` : "-";
  document.getElementById("pScore").textContent = p ? playerScore(p).toFixed(1) : "-";
  document.getElementById("pUnsold").textContent = p && p.unsold
    ? `이미 ${p.unsold}번 유찰된 선수 — 이번에도 유찰되면 빈자리 팀에 무작위 배정` : "";

  // 현재 최고가
  document.getElementById("bidAmount").textContent = bid.amount;
  const leader = document.getElementById("bidLeader");
  if (bid.team !== null) { leader.textContent = `${teams[bid.team].name} 최고가`; leader.style.color = teams[bid.team].color; }
  else { leader.textContent = "아직 입찰 없음"; leader.style.color = ""; }

  // 상태 문구와 버튼
  const msg = { ready: "‘경매 시작’을 누르면 시간이 흐릅니다.", running: `입찰할 때마다 +${CONFIG.bidAddSeconds}초 (최대 ${CONFIG.maxSeconds}초)`, paused: "일시정지 중", result: "결과 발표 중…", done: "모든 선수 경매 완료" };
  document.getElementById("stateLine").textContent = msg[state];
  document.getElementById("btnStart").disabled = !(state === "ready" || state === "paused");
  document.getElementById("btnStart").textContent = state === "paused" ? "다시 진행 (Space)" : "경매 시작 (Space)";
  document.getElementById("btnPause").disabled = state !== "running";
  document.getElementById("btnHammer").disabled = !(state === "running" || state === "paused");
  const sold = teams.reduce((a, t) => a + t.roster.length, 0);
  document.getElementById("progress").textContent = `배정 ${sold} / ${PLAYERS_SEED.length}명`;

  // 대기 순서
  document.getElementById("queue").innerHTML = queue.length
    ? queue.map((q, i) => `<li><span class="n">${i + 1}</span><span class="nm">${q.name}</span>${q.unsold ? `<span class="tag-unsold">유찰 ${q.unsold}</span>` : ""}<span>${playerScore(q).toFixed(1)}</span></li>`).join("")
    : `<li><span class="nm" style="color:var(--muted)">대기 선수 없음</span></li>`;

  // 팀
  for (const t of teams) {
    const el = document.querySelector(`.team[data-id="${t.id}"]`);
    const { sum, avg } = teamScore(t);
    el.querySelector('[data-k="slots"]').textContent = `${CONFIG.teamSize - t.roster.length} / ${CONFIG.teamSize}`;
    el.querySelector('[data-k="points"]').innerHTML = `${t.points}<small>P 남음</small>`;
    el.querySelector('[data-k="sum"]').textContent = sum.toFixed(1);
    el.querySelector('[data-k="avg"]').textContent = avg === null ? "-" : avg.toFixed(1);
    const rows = t.roster.map(r => `<li><span>${r.player.name} <span style="color:var(--muted)">${playerScore(r.player).toFixed(1)}</span></span><span class="pr ${r.random ? "rnd" : ""}">${r.random ? "무작위" : r.price + "P"}</span></li>`);
    while (rows.length < CONFIG.teamSize) rows.push(`<li class="empty">빈자리</li>`);
    el.querySelector('[data-k="roster"]').innerHTML = rows.join("");
    el.classList.toggle("leading", bid.team === t.id && state !== "result");

    // 버튼 켜기/끄기 — 포인트가 모자라거나 자리가 없으면 눌리지 않음
    let why = null;
    el.querySelectorAll("[data-q]").forEach(b => {
      const r = bidBlockReason(t, bid.amount + Number(b.dataset.q));
      b.disabled = !!r;
      if (r && !why) why = r;
    });
    const dr = bidBlockReason(t, bid.amount + CONFIG.bidStep);
    el.querySelector("[data-direct]").disabled = !!dr;
    el.querySelector("input").disabled = !!dr;
    el.querySelector('[data-k="why"]').textContent = state === "running" && why ? `입찰 불가: ${why}` : "";
    if (t.id === changedTeamId) bumpEl(el.querySelector('[data-k="points"]'), "changed");
  }
  renderTimer();
}

function renderTimer() {
  const left = timeLeft();
  const num = document.getElementById("timerNum");
  num.textContent = state === "done" || state === "result" ? "-" : (left / 1000).toFixed(1);
  num.classList.toggle("low", state === "running" && left < 5000);
  document.getElementById("timerBar").style.width = `${Math.min(100, left / (CONFIG.maxSeconds * 1000) * 100)}%`;
}

function addLog(text, kind = "") {
  const li = document.createElement("li");
  li.className = kind;
  li.textContent = text;
  const ul = document.getElementById("log");
  ul.prepend(li);
  while (ul.children.length > 60) ul.lastChild.remove();
}

function flash(title, subHtml, color) {
  const f = document.getElementById("flash");
  f.style.setProperty("--c", color);
  document.getElementById("flashTitle").textContent = title;
  document.getElementById("flashSub").innerHTML = subHtml;
  bumpEl(f, "show");
}

function bumpEl(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

let toastTimer;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 2200);
}

/* =====================================================================
   [6] 조작 버튼
   ===================================================================== */
document.getElementById("btnStart").addEventListener("click", startLot);
document.getElementById("btnPause").addEventListener("click", pauseLot);
document.getElementById("btnHammer").addEventListener("click", finishLot);
document.getElementById("btnReset").addEventListener("click", () => { if (confirm("처음부터 다시 시작할까요? 지금까지 결과가 지워집니다.")) { state = "done"; init(); } });
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || e.target.tagName === "INPUT") return;
  e.preventDefault();
  if (state === "running") pauseLot(); else startLot();
});

init();
</script>
</body>
